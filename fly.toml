# fly.toml app configuration file generated for clinic-backend-okmezw on 2026-09-18T12:59:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clinic-backend-okmezw'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  CLINIC_TZ = 'Africa/Cairo'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
